<svg xmlns="http://www.w3.org/2000/svg" width="736" height="736" viewBox="0 0 736 736" role="img" aria-labelledby="title description">
  <title id="title">Hand-drawn rabbit</title>
  <desc id="description">A minimalist black continuous-line rabbit drawing on warm white paper with a subtle textured beige edge.</desc>
  <defs>
    <filter id="edgeTexture" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.68 0.82" numOctaves="3" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.24 0 0 0 0.68  0 0.18 0 0 0.66  0 0 0.14 0 0.62  0 0 0 0.34 0" result="warmNoise"/>
      <feBlend in="SourceGraphic" in2="warmNoise" mode="multiply"/>
    </filter>
    <filter id="paperShadow" x="-2%" y="-2%" width="106%" height="106%" color-interpolation-filters="sRGB">
      <feDropShadow dx="2.5" dy="0.6" stdDeviation="2.1" flood-color="#5d574f" flood-opacity="0.42"/>
    </filter>
    <filter id="paperGrain" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.92 0.76" numOctaves="2" seed="7" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0.08 0 0 0 0.92  0 0.06 0 0 0.93  0 0 0.04 0 0.91  0 0 0 0.10 0" result="softGrain"/>
      <feBlend in="SourceGraphic" in2="softGrain" mode="screen"/>
    </filter>
  </defs>

  <rect width="736" height="736" fill="#e4ddd5" filter="url(#edgeTexture)"/>
  <rect x="12" y="12" width="712" height="712" fill="#fefff9" filter="url(#paperShadow)"/>
  <rect x="12" y="12" width="712" height="712" fill="#fefff9" filter="url(#paperGrain)"/>

